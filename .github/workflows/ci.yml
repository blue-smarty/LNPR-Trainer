name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # Try editable install via pyproject.toml first; fall back to requirements files.
          if pip install -e ".[dev]" 2>/dev/null; then
            echo "Installed project in editable mode with dev extras."
          else
            echo "Editable install unavailable; falling back to requirements files."
            pip install -r requirements.txt || true
            pip install pytest pytest-cov ruff black mypy
          fi

      - name: Lint with ruff
        run: ruff check .

      - name: Check formatting with black
        run: black --check .

      - name: Run tests
        run: pytest
